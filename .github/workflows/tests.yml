name: tests

# 每次推送到 main、每个 PR，以及手动触发时运行全部测试
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (Windows / Python 3.12)
    # 界面测试需要真实 Tk 环境，所以用 Windows 运行器而不是 Linux
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      # 测试与断言信息含中文，统一 UTF-8 避免运行器控制台编码差异
      PYTHONUTF8: "1"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 运行全部测试
        shell: pwsh
        run: |
          # 把完整输出同时写到控制台与文件：失败时便于本地/远端排查
          # （-q 会把回溯压成一行，这里失败时改用 --tb=short 的完整视图兜底）
          python -m pytest -q 2>&1 | Tee-Object -FilePath pytest-output.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            "=== 失败摘要（供远端诊断）==="
            Select-String -Path pytest-output.txt -Pattern '^FAILED|^ERROR|assert|Error' |
              Select-Object -Last 60 | ForEach-Object { $_.Line }
          }
          exit $code

      - name: 运行全部测试（失败时重跑以获取完整回溯）
        if: failure()
        shell: pwsh
        run: |
          python -m pytest -q --tb=long -x 2>&1 | Tee-Object -FilePath pytest-full.txt
          exit 0

      - name: 保存测试输出
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: |
            pytest-output.txt
            pytest-full.txt
          if-no-files-found: ignore

      - name: 自检（仅在运行器有可用 Tk 桌面会话时执行）
        shell: pwsh
        run: |
          python -c "import tkinter; tkinter.Tk().destroy()" 2>$null
          if ($LASTEXITCODE -eq 0) {
            python main.py --selftest --report selftest-report.json
            Get-Content selftest-report.json
          } else {
            Write-Output "跳过自检：该运行器没有可用的 Tk 桌面会话"
          }

      - name: 保存自检报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-report
          path: selftest-report.json
          if-no-files-found: ignore
